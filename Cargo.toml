[workspace]
members = ["test-libzstd-rs-sys"]

exclude = [ "fuzz" ]

[workspace.package]
edition = "2021"

[package]
name = "libzstd-rs-sys"
version = "0.0.1-prerelease.2"
repository = "https://github.com/trifectatechfoundation/libzstd-rs-sys"
description = "a rust implementation of zstd compression and decompression"
license = "BSD-3-Clause"
publish = true
edition = "2021"
autobins = false
include = [
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "*.rs",
    "lib/**/*.rs",
    "lib/common/portability_macros.h",
    "zstd.h",
    "lib/decompress/huf_decompress_amd64.S",
]

[lib]
name = "libzstd_rs_sys"
path = "c2rust-lib.rs"
crate-type = ["staticlib", "rlib"]

[profile.relwithdebinfo]
inherits = "release"
debug = true

[dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(target_arch = "x86_64")'.build-dependencies]
cc = "1.2.30"

[dev-dependencies]
quickcheck = "1.0.3"
zstd-sys = { version = "2.0.15", features = ["experimental"] }

[dev-dependencies.xxhash-rust]
version = "0.8.15"
features = ["xxh64", "xxh32"]

[features]
default = ["rust-allocator", "std"]
std = ["dep:libc"]
export-symbols = [] # whether the zlib api symbols are publicly exported
custom-prefix = ["export-symbols"] # use the LIBZSTD_RS_SYS_PREFIX to prefix all exported symbols
semver-prefix = ["export-symbols"] # prefix all symbols in a semver-compatible way
no-prefetch = [] # do not prefetch
trace = []
nightly = []
c-allocator = []
rust-allocator = []
unsafe-performance-experimental = []
